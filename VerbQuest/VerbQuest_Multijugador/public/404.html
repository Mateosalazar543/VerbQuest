<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#008fff">
  <title>Page not found | VerbQuest</title>

    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#008fff;color:#fff;font:500 19px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.006em}

    a:focus-visible{outline:3px solid #111;outline-offset:3px}

  <main>
    <h1><span>404</span>, page not found</h1>
